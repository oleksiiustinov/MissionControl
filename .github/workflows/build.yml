name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare
        run: |
          git config --global --add safe.directory '*'
          # The Makefile derives the version from the latest tag; forks don't always carry upstream's tags
          git fetch --tags https://github.com/ndeadly/MissionControl.git || true
          dkp-pacman -Sy --noconfirm --needed switch-libjpeg-turbo zip || true

      - name: Build
        run: make -j$(nproc) dist

      - name: Upload SD card package
        uses: actions/upload-artifact@v4
        with:
          name: MissionControl-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/atmosphere
            dist/config
